version: "3.8"

services:
  db:
    image: mysql:8
    restart: always
    # environment:
    #   MYSQL_ROOT_PASSWORD: rootpassword
    #   MYSQL_DATABASE: movies_db
    volumes:
      - movie-vol:/var/lib/mysql
    networks:
      - movie-net

  backend:
    build: ./backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: movies_db
    depends_on:
      - db
    networks:
      - movie-net

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8000:8080"
    networks:
      - movie-net

volumes:
  movie-vol:

networks:
  movie-net:
    driver: bridge
