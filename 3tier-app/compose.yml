version: "3.9"

services:
  db:
    image: mysql:8.0
    # container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

  backend:
    build: ./backend
    # container_name: backend-api
    environment:
      environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build: ./frontend
    # container_name: frontend-ui
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
